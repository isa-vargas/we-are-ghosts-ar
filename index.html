<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>We Are Ghosts AR</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "
  >

    <a-assets>

      <!-- VIDEO -->

      <video
        id="montageVideo"
        src="assets/videos/Montage.mp4"
        preload="auto"
        loop
        muted
        autoplay
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

      <!-- WATER TEXTURES -->

      <img
        id="waterOne"
        src="assets/images/water-1.jpg"
      >

      <img
        id="waterTwo"
        src="assets/images/water-2.jpg"
      >

    </a-assets>

    <a-marker preset="hiro">

      <!-- WATER LAYER 1 -->

      <a-plane
        src="#waterTwo"
        position="0 0.02 0"
        rotation="-90 0 0"
        width="1.5"
        height="1.5"
        material="
          transparent: true;
          opacity: 0.55;
        ">
      </a-plane>

      <!-- WATER LAYER 2 -->

      <a-plane
        src="#waterOne"
        position="0 0.04 0"
        rotation="-90 0 0"
        width="1.5"
        height="1.5"
        material="
          transparent: true;
          opacity: 0.35;
        ">
      </a-plane>

      <!-- VIDEO -->

      <a-video
        src="#montageVideo"
        position="0 0.35 0"
        rotation="-90 0 0"
        width="0.85"
        height="0.48"
        material="shader: flat;">
      </a-video>

      <!-- GLOW SPHERE -->

      <a-sphere
        position="0 0.8 0"
        radius="0.08"
        material="
          color: white;
          emissive: white;
          emissiveIntensity: 2;
        ">
      </a-sphere>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>

    const video = document.querySelector("#montageVideo");

    async function startExperience() {

      try {

        video.muted = true;
        video.playsInline = true;

        await video.play();

        console.log("Video playing");

      } catch(err) {

        console.log("Playback failed:", err);

      }

      document.removeEventListener("click", startExperience);
      document.removeEventListener("touchstart", startExperience);

    }

    document.addEventListener("click", startExperience);
    document.addEventListener("touchstart", startExperience);

  </script>

</body>

</html>
