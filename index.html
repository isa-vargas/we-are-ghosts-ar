<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>We Are Ghosts AR</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    AFRAME.registerComponent("scroll-water-one", {
      tick: function (time) {
        const mesh = this.el.getObject3D("mesh");
        if (mesh && mesh.material && mesh.material.map) {
          mesh.material.map.offset.y = time * 0.00005;
        }
      }
    });

    AFRAME.registerComponent("scroll-water-two", {
      tick: function (time) {
        const mesh = this.el.getObject3D("mesh");
        if (mesh && mesh.material && mesh.material.map) {
          mesh.material.map.offset.y = -time * 0.00004;
        }
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">

  <button
    id="startButton"
    style="
      position: fixed;
      z-index: 9999;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 22px;
      font-size: 16px;
    ">
    Start AR
  </button>

  <a-scene
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets>
      <video
        id="montageVideo"
        src="assets/videos/Montage.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline>
      </video>

      <img id="waterOne" src="assets/images/water-1.jpg">
      <img id="waterTwo" src="assets/images/water-2.jpg">
    </a-assets>

    <a-marker preset="hiro">

      <!-- ocean floor layer 1 -->
      <a-plane
        src="#waterTwo"
        position="0 0 0"
        rotation="-90 0 0"
        width="2.5"
        height="2.5"
        material="shader: flat; transparent: true; opacity: 0.55;"
        scroll-water-two>
      </a-plane>

      <!-- ocean floor layer 2 -->
      <a-plane
        src="#waterOne"
        position="0 0.02 0"
        rotation="-90 0 0"
        width="2.5"
        height="2.5"
        material="shader: flat; transparent: true; opacity: 0.35;"
        scroll-water-one>
      </a-plane>

      <!-- video plane standing above ocean -->
      <a-plane
        material="src: #montageVideo; shader: flat;"
        position="0 0.55 0"
        rotation="0 0 0"
        width="0.85"
        height="0.48">
      </a-plane>

      <!-- small glow sphere / moon -->
      <a-sphere
        position="0 0.95 0"
        radius="0.08"
        material="color: white; emissive: white; emissiveIntensity: 2;">
      </a-sphere>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const button = document.querySelector("#startButton");
    const video = document.querySelector("#montageVideo");

    button.addEventListener("click", async function () {
      try {
        video.muted = true;
        video.playsInline = true;
        video.currentTime = 0;

        await video.play();

        button.style.display = "none";
        console.log("Video started");
      } catch (error) {
        console.log("Video failed:", error);
        button.innerText = "Tap Again";
      }
    });
  </script>

</body>

</html>
